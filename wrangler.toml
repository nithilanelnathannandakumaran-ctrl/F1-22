name = "f1-22"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
# /api/* goes to the Worker first, everything else is served from ./public
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "f1-22"
database_id = "PASTE_YOUR_DATABASE_ID_HERE"
